<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargando película...</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        
        .container {
            /* Aquí cargamos tu imagen subida */
            background-image: url('fondo.jpg'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        .box {
            background-color: rgba(30, 96, 117, 0.9);
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .timer {
            font-size: 80px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box">No presiones nada</div>
        <div style="font-size: 24px;">Tu Película en 5 segundos...</div>
        <div class="timer" id="countdown">5</div>
    </div>

    <script>
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');

        const interval = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = 'https://www.plex.tv';
            }
        }, 1000);
    </script>
</body>
</html>
